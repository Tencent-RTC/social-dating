plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

def albumpickerVersion = "1.0.0"

project.buildDir = new File(rootProject.buildDir, "albumpicker")

android {
    namespace 'io.trtc.tuikit.atomicx.albumpicker'
    compileSdk 35

    defaultConfig {
        minSdk 21
        buildConfigField "String", "VERSION_NAME", "\"${albumpickerVersion}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    sourceSets {
        main {
            java.srcDirs = []
            kotlin.srcDirs = [
                    '.'
            ]
            res.srcDirs = [
                    '../../../../../../res-albumpicker',
            ]
            manifest.srcFile 'AndroidManifest.xml'
        }
    }
}

dependencies {
    api "io.trtc.uikit:albumpickercore:${albumpickerVersion}"

    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'androidx.activity:activity-ktx:1.7.2'
}